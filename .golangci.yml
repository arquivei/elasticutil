version: "2"
linters:
  default: none
  enable:
    - bodyclose
    - copyloopvar
    - dupl
    - goconst
    - gocyclo
    - govet
    - ineffassign
    - nakedret
    - noctx
    - prealloc
    - rowserrcheck
    - staticcheck
    - unconvert
    - unparam
  settings:
    govet:
      disable:
        # Avoids touching reflect.Ptr inside code blocks duplicated between
        # querybuilder.go and official/v7, which fails Sonar's duplication gate.
        - inline
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - goconst
        path: (_test\.go$|^examples/)
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
